<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="ttl">
<title id="ttl">MAVLink 2 security testing — ArduCopter SITL fuzzing</title>
<defs>
  <style>
    .m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  </style>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1D1B19"/><stop offset="1" stop-color="#121110"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#F5F1EA" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E0894F" stop-opacity=".85"/>
    <stop offset="1" stop-color="#E0894F" stop-opacity=".12"/>
  </linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#E0894F"/>
  </marker>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#grid)"/>

<!-- corner ticks -->
<g stroke="#E0894F" stroke-width="3" fill="none" opacity=".9">
  <path d="M48 84V48h36"/><path d="M1516 48h36v36"/><path d="M48 916v36h36"/><path d="M1552 916v36h-36"/>
</g>

<!-- packet strip -->
<g class="m" font-size="21" letter-spacing="3.4" fill="#8A837A">
  <text x="96" y="128" fill="#E0894F">FD</text>
  <text x="138" y="128">09 00 00 4E 01 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 8D 7A</text>
  <text x="96" y="162" opacity=".55">FD FF 00 00 4E 01 00 · FD 00 00 00 21 01 00 · FD 01 00 00 00 01 00</text>
</g>
<line x1="96" y1="186" x2="1504" y2="186" stroke="url(#fade)" stroke-width="1.5"/>

<!-- title block -->
<text class="m" x="96" y="258" font-size="22" letter-spacing="7.5" fill="#E0894F">PROTOCOL FUZZING · SITL</text>
<text class="s" x="94" y="372" font-size="108" font-weight="700" letter-spacing="-2" fill="#F5F1EA">MAVLink 2</text>
<text class="s" x="96" y="446" font-size="46" font-weight="600" letter-spacing="8" fill="#B9B2A8">SECURITY TESTING</text>
<text class="m" x="98" y="502" font-size="27" letter-spacing="4" fill="#8A837A">ArduCopter SITL</text>

<!-- flow chain -->
<g transform="translate(96,596)">
  <g class="m" font-size="20" letter-spacing="2.6">
    <rect x="0" y="0" width="330" height="64" fill="none" stroke="#F5F1EA" stroke-opacity=".22"/>
    <text x="22" y="40" fill="#F5F1EA">PYTHON FUZZER</text>
    <line x1="165" y1="64" x2="165" y2="104" stroke="#E0894F" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="182" y="94" fill="#E0894F" font-size="17">TCP 5760</text>

    <rect x="0" y="108" width="330" height="64" fill="none" stroke="#E0894F" stroke-opacity=".75"/>
    <text x="22" y="148" fill="#E0894F">MAVLINK 2 · FD</text>
    <line x1="165" y1="172" x2="165" y2="212" stroke="#E0894F" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="0" y="216" width="330" height="64" fill="none" stroke="#F5F1EA" stroke-opacity=".22"/>
    <text x="22" y="256" fill="#F5F1EA">ARDUCOPTER SITL</text>
    <line x1="165" y1="280" x2="165" y2="320" stroke="#E0894F" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="182" y="310" fill="#E0894F" font-size="17">TCP 9001</text>

    <rect x="0" y="324" width="330" height="64" fill="none" stroke="#F5F1EA" stroke-opacity=".22"/>
    <text x="22" y="364" fill="#F5F1EA">SITL MONITOR</text>
  </g>
</g>

<!-- quadrotor schematic -->
<g transform="translate(1075,620)" fill="none" stroke="#F5F1EA" stroke-opacity=".5" stroke-width="3.5" stroke-linecap="round">
  <path d="M-150-118 L-52-20 M150-118 L52-20 M-150 118 L-52 20 M150 118 L52 20"/>
  <g stroke="#E0894F" stroke-opacity=".9">
    <circle cx="-150" cy="-118" r="52"/><circle cx="150" cy="-118" r="52"/>
    <circle cx="-150" cy="118" r="52"/><circle cx="150" cy="118" r="52"/>
  </g>
  <rect x="-54" y="-32" width="108" height="64" rx="10" stroke="#F5F1EA" stroke-opacity=".75"/>
  <path d="M0-32 V-84" stroke="#E0894F"/>
  <g stroke="#E0894F" stroke-opacity=".8" stroke-width="3">
    <path d="M-30-104 A42 42 0 0 1 30-104"/>
    <path d="M-52-126 A72 72 0 0 1 52-126"/>
  </g>
</g>
<text class="m" x="1075" y="806" font-size="18" letter-spacing="3.4" fill="#8A837A" text-anchor="middle">UAV / UAS SECURITY</text>

<!-- baseline -->
<line x1="96" y1="886" x2="1504" y2="886" stroke="#F5F1EA" stroke-opacity=".14" stroke-width="1.5"/>
<text class="m" x="96" y="932" font-size="19" letter-spacing="3.2" fill="#8A837A">PYTHON · pymavlink · TCP/IP · AUTOMATED MONITORING</text>

<!-- EMH mark, subtle, corner -->
<g transform="translate(1398,896) scale(0.152)" opacity=".62">
  <g fill="none" stroke="#F5F1EA" stroke-width="20.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M198.5 147L83.8 32.4A37.4 37.4 0 0 0 20 58.8L20 375.2A37.4 37.4 0 0 0 83.8 401.6L197.5 287"/>
    <path d="M475.5 147L589.7 32.4A37.4 37.4 0 0 1 653.5 58.8L653.5 375.2A37.4 37.4 0 0 1 589.7 401.6L476.5 287"/>
    <path d="M248 29H425"/><path d="M248 215H425"/><path d="M248 400H425"/>
  </g>
</g>
<text class="m" x="1504" y="944" font-size="16" letter-spacing="3" fill="#8A837A" text-anchor="end">MUHAMMAD HAMZA</text>
</svg>
