# ---------------------------------------------------------------------------
# Automatic project synchronisation
# ---------------------------------------------------------------------------
# Regenerates data/projects.json from the public GitHub repositories of the
# account configured in js/config.js, and commits the result.
#
# The website reads that file instantly on load, then refreshes against the
# live GitHub API in the background — so a brand-new repository shows up right
# away, and the site keeps working even when the API is unreachable.
#
# No secrets are required. GITHUB_TOKEN is provided automatically by Actions.
# ---------------------------------------------------------------------------
name: Update projects

on:
  schedule:
    - cron: "0 4 * * *"        # daily, 04:00 UTC
  workflow_dispatch:            # run on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - "js/config.js"
      - ".github/scripts/fetch-projects.mjs"
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  sync:
    name: Sync repository metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/fetch-projects.mjs

      - name: Commit updated project data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/projects.json; then
            echo "No project changes to commit."
            exit 0
          fi
          git add data/projects.json
          git commit -m "chore: sync project data from GitHub"
          git push
